# The restart CronJob's identity, scoped to the one ClickHouse pod. `list` and `watch`
# cannot be narrowed by resourceNames, so the script polls with `get` instead of
# `kubectl wait`, which needs them.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kvorum-clickhouse-restart
  labels:
    app.kubernetes.io/name: kvorum-clickhouse-restart
    app.kubernetes.io/part-of: kvorum
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kvorum-clickhouse-restart
  labels:
    app.kubernetes.io/name: kvorum-clickhouse-restart
    app.kubernetes.io/part-of: kvorum
rules:
  - apiGroups: ['']
    resources: ['pods']
    resourceNames: ['kvorum-clickhouse-0']
    verbs: ['get', 'delete']
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kvorum-clickhouse-restart
  labels:
    app.kubernetes.io/name: kvorum-clickhouse-restart
    app.kubernetes.io/part-of: kvorum
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kvorum-clickhouse-restart
subjects:
  - kind: ServiceAccount
    name: kvorum-clickhouse-restart
